; Sesuaikan path, username server, versi php dan izin folder aplikasi.
[program:meeting-ai-processing]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.2 /var/www/meeting-ai-laravel/artisan queue:work database --queue=processing --sleep=1 --tries=1 --timeout=3400
numprocs=1
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/meeting-ai-laravel/storage/logs/worker-processing.log
stopwaitsecs=3450

[program:meeting-ai-drive]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.2 /var/www/meeting-ai-laravel/artisan queue:work database --queue=drive --sleep=1 --tries=5 --timeout=300
numprocs=2
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/meeting-ai-laravel/storage/logs/worker-drive.log
stopwaitsecs=350
